[tox]
minversion = 4.0
envlist = noble,resolute,latest,pep8
skip_missing_interpreters = True

[testenv]
usedevelop = True
setenv =
   VIRTUAL_ENV={envdir}
   PYTHONWARNINGS=default::DeprecationWarning
   OS_STDOUT_CAPTURE=1
   OS_STDERR_CAPTURE=1
   OS_TEST_TIMEOUT=60
deps = -r{toxinidir}/test-requirements.txt
commands = stestr run "^vaultlocker.tests.unit.*" {posargs}

[testenv:noble]
basepython = python3.12
deps =
    -r{toxinidir}/requirements-noble.txt
    -r{toxinidir}/test-requirements.txt

[testenv:resolute]
basepython = python3.14
deps =
    -r{toxinidir}/requirements-resolute.txt
    -r{toxinidir}/test-requirements.txt

[testenv:latest]
basepython = python3.14
deps =
    -r{toxinidir}/requirements.txt
    -r{toxinidir}/test-requirements.txt

[testenv:pep8]
commands = flake8 {posargs}

[testenv:venv]
commands = {posargs}

[testenv:func3]
basepython = python3
commands = pifpaf run vault -- stestr run "^vaultlocker.tests.functional.*"

[testenv:cover]
setenv =
    VIRTUAL_ENV={envdir}
    PYTHON=coverage run --source vaultlocker --parallel-mode
commands =
    stestr run "^vaultlocker.tests.unit.*" {posargs}
    coverage combine
    coverage html -d cover
    coverage xml -o cover/coverage.xml

[testenv:docs]
commands = python setup.py build_sphinx

[testenv:releasenotes]
commands =
  sphinx-build -a -E -W -d releasenotes/build/doctrees -b html releasenotes/source releasenotes/build/html

[testenv:debug]
commands = oslo_debug_helper {posargs}

[flake8]
# E123, E125 skipped as they are invalid PEP-8.

show-source = True
ignore = E123,E125,W504
builtins = _
exclude=.venv,.git,.tox,dist,doc,*lib/python*,*egg,build
